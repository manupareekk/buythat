services:
  - type: web
    name: buythat
    runtime: python
    plan: standard
    buildCommand: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt && python -m scripts.warm_models
    startCommand: uvicorn buythat.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/config
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
